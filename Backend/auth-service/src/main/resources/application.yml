server:
  port: 8082

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scorpionbank_auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

customer:
  service:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 900000